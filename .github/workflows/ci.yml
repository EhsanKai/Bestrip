# Both halves, on every push. The frontend job runs `tsc -b` before `vite
# build` (that is what `npm run build` is), so a type error fails here rather
# than at deploy time.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

  frontend:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Building it is the test: the image is what gets deployed, and it fails
      # on a type error or a bad dependency before anything reaches a host.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: detoura:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Serve the client and the API from the running image
        run: |
          docker run -d --name detoura -p 8000:8000 detoura:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done

          echo "--- health ---"
          curl -fsS http://localhost:8000/api/v1/health

          echo "--- the app shell ---"
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'

          echo "--- an unknown API path must be a JSON 404, not the shell ---"
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/nope)
          test "$status" = "404"

          # The client's API base is inlined at build time, so a mis-set
          # VITE_API_BASE is baked into the bundle rather than raised at
          # startup. An empty value compiles every request down to `/search`,
          # which health checks and a rendering page both sail straight past -
          # only the searches fail. Assert the base is actually in there.
          echo "--- the served bundle must carry the API base ---"
          asset=$(curl -fsS http://localhost:8000/ | grep -o '/assets/[^"]*\.js' | head -1)
          test -n "$asset"
          curl -fsS "http://localhost:8000$asset" | grep -q '/api/v1'

          echo "--- and a real search must round-trip through it ---"
          curl -fsS -X POST http://localhost:8000/api/v1/search \
            -H 'Content-Type: application/json' \
            -d '{"origin":"Koln","budget":450,"travelers":2,"duration_days":5,"date_from":"2026-09-10","date_to":"2026-09-15","search_mode":"QUICK"}' \
            | grep -q recommendations

          docker rm -f detoura
