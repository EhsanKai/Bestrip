# Static hosting for the client alone. The API must live somewhere else and be
# named at build time via VITE_API_BASE - see frontend/.env.example.
#
# Set `base` to `frontend` in the Netlify UI, or deploy from this directory.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The client holds its own screen state, so every path is the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints everything under assets/, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The shell names those assets, so it must never be cached.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
