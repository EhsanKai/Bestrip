[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detoura"
version = "0.1.0"
description = "Detoura - AI travel discovery and optimization. Deterministic multi-objective trip search that finds the trips you did not think to look for."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
# Shared session state across worker processes. Optional because the default
# single-worker deployment needs no external service, and demanding one would
# break the product's "one image, no configuration" promise.
session = [
    "redis>=5",
]
dev = [
    "pytest>=7.4",
    "httpx>=0.26",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
