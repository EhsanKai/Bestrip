# One service, both halves, built from the repository's Dockerfile.
#
# Railway and Fly.io need no file at all - they detect the Dockerfile, and the
# image honours $PORT for exactly that reason. This one is here because Render
# is declarative, and because it documents what any host needs to know.

services:
  - type: web
    name: detoura
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Unset on purpose. The client is served from this same service, so its
      # requests are same-origin and CORS never comes into it. Set this only if
      # a client hosted elsewhere needs to call this API.
      - key: DETOURA_CORS_ORIGINS
        sync: false
      # Without this, auth_config().is_production is False and the session/CSRF
      # cookies never get the Secure flag on this HTTPS service - see
      # src/detoura/api/auth.py::_set_auth_cookies and auth_config.py. It also
      # gates the X-Robots-Tag noindex header (src/detoura/api/app.py) - a real
      # production deploy must set this, or it is both insecure and unindexed.
      - key: DETOURA_ENV
        value: production
      # This service is currently the staging environment, not a real public
      # launch - but it still needs DETOURA_ENV=production above for Secure
      # cookies (see that key's comment). DETOURA_ENV alone used to also
      # control search-indexability, which would have forced a choice between
      # Secure cookies and staying out of search indexes; DETOURA_FORCE_NOINDEX
      # (src/detoura/auth_config.py, src/detoura/api/app.py) decouples the two
      # so this service gets both. VITE_STAGING below is the frontend half of
      # the same fix - see its own comment.
      #
      # *** REMOVE both DETOURA_FORCE_NOINDEX and VITE_STAGING below (or set
      # DETOURA_FORCE_NOINDEX to "false") when this service is cut over to the
      # real public production launch - otherwise production ships
      # unindexed. *** See docs/V9_STAGING_RUNBOOK.md and
      # scripts/verify_staging_noindex.sh.
      - key: DETOURA_FORCE_NOINDEX
        value: "true"
      # Build-time only (frontend/vite.config.ts's seoPlugin): emits
      # noindex,nofollow meta tag + a blanket-Disallow robots.txt + no
      # sitemap, regardless of DETOURA_ENV. Render forwards a service's env
      # vars to its Docker build as build args for any ARG the Dockerfile
      # declares under the same name (see Dockerfile's "Stage 1" - VITE_STAGING
      # is already declared there for exactly this), so this also reaches Vite
      # at build time, not merely this container's runtime. Verify this
      # actually took effect after every deploy of this service with
      # `scripts/verify_staging_noindex.sh <this service's URL>` - Render's
      # build-arg forwarding has not been exercised for this variable before.
      - key: VITE_STAGING
        value: "true"
      # Render terminates TLS at its edge and proxies to this container as the
      # single hop in front of it - see services/client_ip.py's Render-specific
      # note. Leaving this at the default (0) means every request behind
      # Render's edge collapses onto one address for IP-based rate limiting.
      - key: AUTH_TRUSTED_PROXY_HOPS
        value: "1"
      # Detoura is single-writer SQLite (persistence/db.py has exactly one
      # sqlite3.connect call site) - everything (accounts, sessions-in-DB
      # tables, bookings, payments, documents, the Ops audit trail) lives in
      # one file. Without this, DETOURA_DB_PATH falls back to the Dockerfile's
      # baked-in /app/data/detoura.db, which sits on this container's
      # EPHEMERAL filesystem with no disk declared below pointed at it -
      # every redeploy would silently wipe the database. This path points
      # inside the disk mounted below, deliberately NOT at /app/data itself:
      # the Dockerfile also bakes destination_images/manifest.json and
      # assets/ as siblings of detoura.db under /app/data (see its COPY
      # steps), and a disk mounted over the whole directory would shadow
      # those build-time assets on first deploy. A narrower subdirectory
      # avoids that collision entirely. SQLite's WAL/SHM sidecar files are
      # always created next to the main file by stock SQLite, so they land
      # on this same disk automatically - no separate configuration needed.
      - key: DETOURA_DB_PATH
        value: /app/data/db/detoura.db
    disk:
      # Single-replica only (Detoura's SQLite/session-store architecture does
      # not support more than one writer - see DEPLOY.md and
      # docs/V9_STAGING_PRODUCTION_OPS_READINESS_REPORT.md §11). Render disks
      # cannot be shared across replicas, which is exactly the constraint
      # this architecture already requires, not a new limitation. Render's
      # Blueprint schema attaches at most one disk per service as a single
      # object here (`disk:`), not a list (`disks:`) - confirmed by a real
      # Blueprint parse rejecting the list form: "field disks not found in
      # type file.Service".
      name: detoura-data
      mountPath: /app/data/db
      sizeGB: 1
